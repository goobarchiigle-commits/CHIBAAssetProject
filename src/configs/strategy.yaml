# strategy.yaml — 戦略パラメータ設定（Single Source of Truth）
# 最終更新: 2026-04-05
# ベースライン: RSR42統一（TEMPORAL24廃止 / capital=3,000,000に修正）
# 2026-04-05: 動的ユニバース採用（dyn_rsr42_bear_rs0: WF5/5, Seg3=+0.258, 2025=0.805 PASS）

fujiko:
  min_sepa: 6           # SEPA条件の最低達成数（8条件中）
  min_rsr: 75.0         # RSR最低閾値（エントリー専用 / 変更禁止）
  rsr_exit: 70.0        # RSR Exit閾値（exitのみ / WF5fold検証済 2026-06-05）
  mom_period: 21        # RSRモメンタム計算期間（感度分析で21がベスト）
  turtle_entry: 20      # タートル・エントリー（20日高値ブレイク）
  turtle_exit: 55       # タートル・エグジット（55日安値割れ）← exit感度テストで20→55に変更 2026-03-31（IS Sharpe +12.6%）
                        # ⚠ DISCARD候補 (design_philosophy_review 2026-07-03): IS単独選定・デッドパラメータ疑い。Stage1では変更しない（Study76/77決着後に判断）
  use_turtle_entry: true

mean_reversion:
  rsi_period: 5
  rsi_entry: 25.0       # RSI<25でエントリー
  rsi_exit: 65.0        # RSI>65でエグジット
  ma_long: 200          # 200日MA（トレンドフィルター）
  stop_loss_pct: 0.07   # 7%ストップロス
  max_hold_days: 10     # 最大保有日数

# risk 制御
risk:
  min_hold_days: 3
  max_hold_days: 60
  emergency_exit_pct: -0.08
  rebalance_interval: 1
  reentry_cooldown_days: 5   # SELL後の同銘柄再エントリー禁止（営業日）
                             # 2026-07-07 SAFETY FIX: 従来「時間ストップ」のみ対象だったが
                             # 全SELL理由（RSR_EXIT/トレーリングストップ/緊急exit等）に拡張

# セクター別戦略割り当て
# sector_strategy:
#   フジコ法: [海運, 機械, 電機精密, 商社, 電機, 食品, 情報通信, 小売, 医薬品, 不動産]
#   平均回帰: [ガス, 鉄鋼, 銀行, 保険, 輸送機器, 化学, 陸運, 石油]

portfolio:
  capital: 3_000_000          # 初期資本（円）← 2026-03-30 実口座300万円と統一
  max_positions: 3            # 最大同時保有銘柄数 ← PARAMS_LOCKED 確定値（2026-03-31）
  min_sectors: 1              # 最低セクター数（制約なし）
  max_single_weight: 0.25     # 1銘柄最大ウェイト（25%）
  max_dd_limit: 0.15          # サーキットブレーカー（-15%）
  vol_target: 0.0             # 0=均等ウェイト（ボラ調整なし）
  use_idm: false              # IDM（Carver分散乗数）不使用

costs:
  slippage_rate: 0.001        # スリッページ 0.1%
  commission_rate: 0.00055    # 手数料 0.055%（auカブコム ワンクリック株）
  min_commission: 99          # 最低手数料 99円

# レジーム別フラクション（run_multi_strategy 用: zero_bull採用 2026-05-03）
# 変更時は run_variants() で必ず再検証すること
# bull=0.0: OOS Sharpe +2.226（vs base=+1.827）、IS MaxDD -1.8%（circuit breaker余裕あり）
fraction:
  bull: 0.0    # xs_ret5d > 0 の日: 発注しない（bull期間はSharpe=+0.096で低品質）
               # ⚠ DISCARD候補 (design_philosophy_review 2026-07-03): OOS選定バイアス疑い。Stage1では変更しない（Study76/77決着後に判断）
  bear: 0.02   # xs_ret5d <= 0 の日: 資本の2%を配置

# Entry Freeze（資産保全モード・2026-07-17 Study100/101帰結により有効化）
# enabled: true で新規BUYを全面停止。SELL/exit・signal generation・diagnosticsは無停止。
# 緊急上書き: 環境変数 ENTRY_FREEZE_ENABLED=1/0 がここの値より優先される。
# 解除にはユーザーの明示指示が必要（ASK_FIRST）。
entry_freeze:
  enabled: true
  reason: "Research Freeze"

# リスク制御フラグ（feature flag で切替可能）
# 変更時は必ず WF再検証 → CLAUDE.md ルールに従い確認を取ること
risk_controls:
  shock_exit_mode: composite  # full_exit | partial_50 | composite（2026-04-05 WF検証済み採用）
  regime_sizing: none         # none | regime_2 | regime_4（regime_2はWF失敗→研究ブランチに移行）
  bear_scale: 0.25            # TOPIX MA200下のポジションサイズ係数（regime_sizing 有効時のみ使用）
  # ── cap 設定（2026-04-07 追加）──────────────────────────────
  dynamic_cap: false          # research only, default OFF（true=ボラ連動cap, false=固定cap）
  symbol_cap: 0.40            # 固定 symbol cap（dynamic_cap: false 時に使用）
                              # max_positions=3 均等配分で order_weight=0.333 → cap>0.333 が必要
                              # 0.40 は十分余裕あり（変更不要）
  sector_cap: 0.25            # 固定 sector cap（dynamic_cap: false 時に使用）
  cluster_cap: 0.35           # cluster cap（Step2で使用）
  bear_sector_cap: 0.18       # Bear 時の sector cap（Step3で使用）
  bear_cluster_cap: 0.25      # Bear 時の cluster cap（Step3で使用）
  # ── gross exposure 縦方向制御（2026-04-07 追加）───────────────────
  gross_exposure_enabled: true
  gross_cap_normal: 1.0
  gross_cap_drawdown_5pct: 0.6   # TOPIX 20日リターン < -5% 時
  gross_cap_drawdown_8pct: 0.4   # TOPIX 60日リターン < -8% 時
  # ── セクター集中ゲート（2026-04-09 追加）────────────────────────────
  # 同一セクターへの集中保有を防ぐ（5401.T+5411.T 鉄鋼同時保有の再発防止）
  sector_concentration:
    enabled: true
    max_names_per_sector: 1      # 同一セクターは同時1銘柄まで
    max_weight_per_sector: 0.35  # セクター合計ウェイト上限35%
  # ── 動的セクター除外（research only / production=false）─────────────
  bear_dynamic_filter:
    enabled: false             # research only（本番は false を維持）
    rs_lookback_days: 63       # 相対弱度の計算期間（63営業日≒3ヶ月）
    rs_threshold: 0.0          # sector_rs < threshold で除外（0.0=TOPIX 比マイナスを全除外）
    lookback_days: 60        # rolling window for MA200 below count
    ma200_below_days: 40     # bear判定閾値: 60日中40日以上MA200割れ
    excluded_sectors:
      - "機械"
      - "鉄鋼"
      - "銀行業"
      - "保険業"
      - "輸送用機器"
      - "海運業"
      - "化学"

# 動的ユニバース設定（2026-04-05 採用: dyn_rsr42_bear_rs0）
# WF 5/5, Seg3_2022=+0.258, 2025 OOS=0.805 → PASS
# スクリプト: backtest/wf_dyn_rsr42.py / backtest/wf_dynamic_universe.py
dynamic_universe:
  enabled: true
  pool: rsr42                  # rsr42 のみ（TOPIX100拡張は alpha_df 非対応のため不採用）
  bull_active_n: 30            # Bull 時の選択銘柄数上限（RSR42 42銘柄中）
  bear_active_n: 20            # Bear 時の選択銘柄数上限（rs>0フィルター後）
  bull_weights:                # Bull スコアリング重み
    mom_63: 0.40
    rsr: 0.35
    log_vol: 0.25
  bear_weights:                # Bear スコアリング重み（rs>0 フィルター必須）
    rs_topix: 0.50
    rsr: 0.30
    log_vol: 0.20
  bear_rs_filter: true         # Bear 時 rs_topix > 0 のみ対象
  regime_ma_period: 200        # レジーム判定: TOPIX MA期間
  sustained_bear_days: 40      # 直近60日のうち40日以上MA200下 → 持続型Bear
  sustained_bear_lookback: 60  # 持続型Bear判定のルックバック日数

# Bear スコアリング設定（2026-04-07 追加: Step 2 検証用）
# version: "v1"=既存(rs_topix/rsr/log_vol) / "v2"=low_beta+defensive追加
bear_scoring:
  version: "v1"              # 現在は v1 を維持（sweep で v2 を検証）
  rs_topix_w: 0.45           # v2 重み: TOPIX比較RS
  rsr_w: 0.25                # v2 重み: RSR
  low_beta_w: 0.20           # v2 重み: 低ベータスコア（60日ローリング）
  defensive_w: 0.10          # v2 重み: 防御セクター（食品/ガス/情報通信）
  defensive_sectors:         # v2 防御セクター（CSVのセクター略称）
    - "食品"
    - "ガス"
    - "情報通信"

# Bear ユニバースフィルター（production-active: 2026-04-07 採用 WF 5/5）
# config_loader は risk_controls ではなくトップレベルのこのブロックを読む
bear_universe_filter:
  enabled: true              # 本番有効（WF 5/5 確認済み）
  excluded_sectors:          # Bear時に除外するセクター（CSVのセクター名と完全一致）
    - "機械"
    - "鉄鋼"
    - "銀行業"
    - "保険業"
    - "輸送用機器"
    - "海運業"
    - "化学"

# 資本スケーリング制御（2026-05-16 追加）
# capital.actual_equity は毎朝 kabu API から取得 → CAPITAL_STATE_FILE に保存
# effective_capital_growth_limit_daily: 1M入金後 ~3週間で有効資本が4Mへ到達
# max_lot_cost_ratio: 0.30 → 3M時=¥9,000/株まで・4M時=¥12,000/株まで解放
capital_scaling:
  effective_capital_growth_limit_daily: 0.015  # 1.5%/日 上限（入金即時反映を防ぐ）
  cash_buffer_ratio: 0.10                       # 10% キャッシュバッファ（証拠金確保）
  volatility_scalar_enabled: true
  volatility_scalar_min: 0.50                   # 高ボラ時: 有効資本×50%まで縮小
  liquidity_scalar_enabled: true
  liquidity_scalar_min: 0.50
  execution_scalar_enabled: true
  execution_scalar_min: 0.70
  max_participation_rate: 0.05                  # ADV の最大5%まで参加
  min_expected_fill_ratio: 0.80
  max_lot_cost_ratio: 0.30                      # 1単元コスト / 有効資本 ≤ 30%
  shadow_capital_tiers: [1, 2, 5]              # シャドウシミュレーション倍率
  # 資本フリーズ閾値（いずれか一つ超過でgrowth停止）
  freeze_slippage_bps_max: 50.0
  freeze_reject_rate_max: 0.30
  freeze_fill_ratio_min: 0.70
  freeze_liquidity_stress_max: 0.70

# 適応的成長制御（2026-05-16 追加: Phase 2 adaptive geometric-growth optimizer）
# アグレッション EMA / エッジ持続性 / マルチホライゾン / アルファ・インパクト・ゲート
adaptive_growth:
  # アグレッション EMA（非対称: 拡大ゆっくり・縮小素早い）
  aggression_expand_alpha: 0.10     # 拡大時 EMA alpha（遅い）
  aggression_contract_alpha: 0.40  # 縮小時 EMA alpha（速い）
  aggression_min: 0.30
  aggression_max: 1.40
  half_kelly_cap: 0.50             # Half-Kelly 上限（過剰積極性を防ぐ）
  # エッジ持続性ウィンドウ（日数）
  edge_window_short: 5
  edge_window_med: 21
  edge_window_long: 63
  # デプロイメント状態遷移閾値
  enter_aggressive_min_periods: 3  # AGGRESSIVE 移行には連続3日の高アグレッション必要
  enter_opportunistic_min_periods: 2
  exit_aggressive_threshold: 0.75  # この値以下でAGGRESSIVE終了
  enter_defensive_threshold: 0.45  # この値以下でDEFENSIVE移行
  # Alpha-after-impact デプロイメントゲート
  min_net_alpha_threshold_bps: 5.0 # ネットアルファ > 5bps のときのみデプロイ
  # 探索バジェット
  exploration_fraction: 0.05       # 有効資本の5%を探索専用に確保
  # リフレクシビティ検出ウィンドウ
  reflexivity_window: 10
  # マルチホライゾン信頼度 EMA レート
  multihorizon_alpha_execution: 0.40   # 1-5日（高速）
  multihorizon_alpha_signal: 0.15      # 5-21日（中速）
  multihorizon_alpha_regime: 0.06      # 21-63日（低速）
  multihorizon_alpha_strategic: 0.02   # 63-252日（超低速）

# ライブ実行制御（2026-04-07 追加）
# shadow_mode: true = シグナルはログ記録のみ・実発注しない（初日 3営業日推奨）
# false に変更する際は CLAUDE.md の「必ず確認を取る」ルールに従うこと
live_execution:
  shadow_mode: false
  shadow_mode_reason: "Initial live validation: signal→universe→risk→execution pipeline check"

# ── Entry Timing Engine （2026-05-31 追加）────────────────────────────────────
# 変更時は ASK_FIRST ルール適用（PARAMS_LOCKED 範囲外だが実行経路に影響）
# enabled: true = エントリー品質スコアリング有効（デフォルト ON）
# boost_weight: (score-50) * boost_weight をRSR複合スコアに加算
#   デフォルト 0.06 → スコア差100点で ±3pt（RSR選択を支配しない）
# block_low_confidence: LOW 判定の銘柄を当日エントリーブロック（デフォルト OFF）
#   true にする前にバックテスト検証必須 → ASK_FIRST 対象
entry_timing:
  enabled: true
  boost_weight: 0.06        # (score-50) * weight → composite 加算量
                            # ⚠ DISCARD候補 (design_philosophy_review 2026-07-03): 未検証パラメータ。Stage1では変更しない（Study76/77決着後に判断）
  block_low_confidence: false  # LOW confidence 銘柄のエントリーをブロック（ASK_FIRST）
  auto_apply_boost: false   # true = promotion tiered boost_weight を自動適用（ASK_FIRST）

# ── Position Sizing Intelligence （2026-05-31 追加）──────────────────────────
# Phase 1: 観測専用。実発注サイズは変更しない。
# auto_apply: false = 仮想ウェイトはtelemetryのみ（Phase 2昇格まで発注未適用）
# auto_apply: true にする場合は ASK_FIRST + バックテスト検証必須
position_sizing:
  enabled: true
  auto_apply: false   # Phase 2昇格まで false 固定（ASK_FIRST）

# ── Predictive Expansion Early-Entry Overlay （2026-05-21 追加）──────────────
# 変更時は ASK_FIRST ルール適用（特に predictive_entry_enabled: true への変更）
# analytics + shadow watchlist は enabled: true で即時有効
# 実発注オーバーレイは predictive_entry_enabled: true にする前にバックテスト要確認
predictive_expansion:
  enabled: true                    # analytics + shadow watchlist 有効
  predictive_entry_enabled: false  # 実発注オーバーレイ（デフォルト OFF / ASK_FIRST）
  score_threshold: 70.0            # 実発注候補の最低スコア（0-100）
  require_compression: true        # compression_breakout_score ≥ 60 必須
  require_volume_shift: true       # volume_regime_score ≥ 50 必須
  require_sector_ignition: false   # sector ignition は任意条件
  max_predictive_positions: 1      # 同時保有の予測エントリー上限
  predictive_size_ratio: 0.50      # 通常ポジションの50%サイズ
  stop_tightness_ratio: 0.70       # 通常ストップの70%（タイト）
  no_entry_in_cb_active: true      # CB_ACTIVE 中は予測エントリー禁止（変更不可）

# ── Research Candidate Features — Production Configuration D_ATR_EQ ──────────
# Study52 (2026-06-28) 最終採用決定: D_ATR_EQ = ATR Extension + EQ_SCALE
#   IS 2018-2024: CAGR=12.37% MaxDD=-18.12% Sharpe=0.586 Calmar=0.683
#   OOS 2025:     CAGR=13.48% MaxDD=-10.15% Sharpe=1.199 Calmar=1.329
#   WF:           5/5  avg=+18.37%  Seg3_2022=-2.65%
# VOL_ADJ は Study51/52 で有害確認（OOS悪化・MaxDD悪化・Fold variance最大）→ 完全除外
research_candidates:
  # Study40 ATR Extension — RSR exit を最大5営業日延期
  # 採用理由: OOS 2025 +1.84pp、Seg4 Bull 環境での momentum 捕捉
  # 条件: 含み益あり かつ close > highest_close - 1×ATR20
  atr_extension:
    enabled: true               # Study52 ADOPT (D_ATR_EQ)
    atr_mult: 1.0               # deferral threshold: highest_close - mult×ATR20
    max_defer_calendar_days: 7  # 最大延期日数（カレンダー日; ~5営業日）
  # Study41 D_VOL_ADJ — Production から完全除外 (Study52 REJECT 確定)
  # 不採用理由: OOS 2025 -0.96pp、IS MaxDD -1.99pp悪化、Bear保護ゼロ、Fold variance最大
  # 後方互換コードは src/research_candidate/vol_adj.py に残存するが Production では使用しない
  vol_adj:
    enabled: false              # PERMANENTLY DISABLED — Study52 で有害確認済み
    # ⚠ DISCARD候補 (design_philosophy_review 2026-07-03): 残置コード(src/research_candidate/vol_adj.py)含め削除候補。Stage1では変更しない（Study76/77決着後に判断）
    topix_vol_threshold: 0.008  # 参照のみ (enabled=false のため非使用)
    calm_max_positions: 4       # 参照のみ (enabled=false のため非使用)
  # Study45 D_EQ_SCALE Addon — unrealized_gain ≥ 1×ATR20 でアドオン
  # 採用理由: WF 5/5達成、Seg3_2022 -5.11%→-2.65% Bear環境での自動 de-risk
  # サイズ: available_cash × 25%, 1単元未満は発注しない
  eq_scale_addon:
    enabled: true               # Study52 ADOPT (D_ATR_EQ)
    atr_mult: 1.0               # trigger: unrealized_gain_yen >= mult × entry_ATR20
    size_frac: 0.25             # addon size = available_cash × frac (25%)
  # Study57/58A Quality Replacement Engine — Shadow監査のみ。発注変更なし。
  # 条件: 保有銘柄 QS<35 かつ 待機候補 QS>70 → 判定ログ（swap実行しない）
  # 採用根拠: WF5/5, Calmar+0.075, Seg3_2022+3.81pp (Study58A ADOPT)
  # ⚠ enabled=true への変更は ASK_FIRST 必須
  quality_replacement:
    enabled: false              # Shadow only — NEVER set true without ASK_FIRST
    hold_threshold: 35.0        # HoldScore < this → weakest candidate
    cand_threshold: 70.0        # CandScore > this → replacement candidate
    min_hold_days: 3            # Minimum calendar days held before scoring
    # Study57 IS 2018-2024 fit normalization params (LOCKED — do not change)
    qs_weights: {atr_expansion: 0.405, ret_from_entry: 0.342, rsr_delta: 0.253}
    qs_mu:      {atr_expansion: 1.0008, ret_from_entry: 0.3198, rsr_delta: -1.8463}
    qs_sigma:   {atr_expansion: 0.0364, ret_from_entry: 3.6985, rsr_delta: 7.4010}

# entry_stop 改修版パラメータ（portfolio_entry_stop_v2.py 用）
# 注: V2設定（27銘柄 2018-2024）ではMaxDD=-5.67% のため -10%閾値は発動しない
#     実運用で -10% DDに達した際に以下の制御が働く
# entry_stop:
#   entry_stop_dd: 0.10          # -10%でentry_stop発動（新規エントリー禁止）
#   additional_dd_limit: 0.05    # entry_stop中さらに-5%DDで部分クローズ起動
#   partial_close_ratio: 0.30    # 部分クローズ比率（各ポジションの30%を決済）
#   entry_stop_release_ratio: 0.70  # DD が entry_stop_dd × 0.7 まで回復で dd_recovered=True
#   entry_stop_max_days: 20      # 最大在停日数（AND条件の日数側）
#   trend_ma_short: 10           # トレンド判定: equity 短期MA
#   trend_ma_long: 30            # トレンド判定: equity 長期MA
#   cooldown_days: 3             # 解除後N日間は再発動しない
#   just_released_days: 5        # 解除後N日間はポジションサイズを縮小
#   just_released_scale: 0.50    # 縮小比率（50%）

